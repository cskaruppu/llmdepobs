# Serves the portal and forwards /api to the Tensorhelm API. Runs behind the OpenShift oauth-proxy in the same
# pod, which authenticates users and sets X-Forwarded-User. The included file adds the shared secret header the
# API uses to trust that user header; it is mounted from the tensorhelm-proxy Secret.
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  server_tokens off;
  client_max_body_size 4m;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen 8080;
    root /opt/app-root/src;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location = /healthz { return 200 "ok\n"; }

    location /api/ {
      proxy_pass http://tensorhelm-api:8000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-User $http_x_forwarded_user;
      include /etc/tensorhelm/proxy-secret.conf;
      proxy_read_timeout 120s;
    }

    location /assets/ { expires 7d; }

    location / {
      expires -1;
      try_files $uri /index.html;
    }
  }
}
