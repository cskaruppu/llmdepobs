[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tensorhelm"
version = "0.1.0"
description = "Tensorhelm hub API and spoke agent: GPU fleet, model catalog and LLM deployments on OpenShift AI"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "aiosqlite>=0.20",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "kubernetes-asyncio>=30",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
tensorhelm-api = "tensorhelm.main:run"
tensorhelm-agent = "tensorhelm.agent:run"
tensorhelm-admin = "tensorhelm.cli:main"

[tool.setuptools.packages.find]
include = ["tensorhelm*"]

[tool.setuptools.package-data]
tensorhelm = ["data/*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008"]
